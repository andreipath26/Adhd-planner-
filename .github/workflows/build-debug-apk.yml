name: Build Debug APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17 (for SDK Manager)
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n504667f4c0de7973335447fc6aaeb57f9a4982e5" > $ANDROID_HOME/licenses/android-sdk-preview-license
        echo -e "\n8403ad6538eda4133891b6ca8dde43360fdc6b8f" > $ANDROID_HOME/licenses/google-android-sdk-license

    - name: Install Android SDK packages
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

    - name: Set up Java 11 (for Gradle build)
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download Gradle wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        cd gradle/wrapper
        curl -L https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        cd ../../

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK as Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Build Logs on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: build/
        retention-days: 7

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Post Build Status
      if: always()
      run: |
        echo "Build Status: ${{ job.status }}"
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ APK built successfully!"
          echo "📍 Location: app/build/outputs/apk/debug/app-debug.apk"
        else
          echo "❌ Build failed. Check logs above."
        fi
